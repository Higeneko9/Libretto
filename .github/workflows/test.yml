name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      all_os:
        description: Run on Windows and macOS too
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.all_os == 'true' && '["ubuntu-24.04","windows-latest","macos-latest"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test
