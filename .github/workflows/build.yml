name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: |
          python -m pip install -r backend/requirements.txt pyinstaller
      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Import signing certificate
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          [ -n "$CSC_LINK" ] || exit 0
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci-pass "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci-pass "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-pass "$KEYCHAIN" > /dev/null 2>&1 || echo "partition list not set (codesign is already allowed by import)"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "LB_MAC_SIGNED=true" >> "$GITHUB_ENV"
      # electron and electron-builder download their binaries from GitHub releases, which sometimes answers 504
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Build installer
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm run dist && exit 0
            echo "build attempt $attempt failed"; sleep 20
          done
          exit 1
        working-directory: desktop
        env:
          PYTHON: python
          # macOS signing and notarization run only when the Developer ID secrets exist; otherwise the app is ad-hoc signed
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.LB_MAC_SIGNED == 'true' && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: libretto-desktop-windows
          retention-days: 3
          compression-level: 0
          path: desktop/release/*.exe
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: libretto-desktop-macos
          retention-days: 3
          compression-level: 0
          path: desktop/release/*.dmg
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: libretto-desktop-linux-deb
          retention-days: 3
          compression-level: 0
          path: desktop/release/*.deb
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-24.04'
        with:
          name: libretto-desktop-linux-appimage
          retention-days: 3
          compression-level: 0
          path: desktop/release/*.AppImage
      # the same server bundle, for running Libretto in a normal browser.
      # tar.gz keeps the executable bits and symlinks that upload-artifact would drop.
      - name: Pack the server bundle
        if: runner.os != 'Windows'
        run: tar -czf libretto-server-${{ runner.os }}.tar.gz -C desktop/build backend
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: libretto-server-${{ matrix.os }}
          retention-days: 3
          compression-level: 0
          path: libretto-server-*.tar.gz
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: libretto-server-windows
          retention-days: 3
          path: desktop/build/backend

  release:
    # tag pushes only: attach every installer and server bundle to a GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect release files
        run: |
          mkdir release
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name 'libretto-server-*.tar.gz' \) -exec mv {} release/ \;
          (cd dist/libretto-server-windows && zip -qr ../../release/libretto-server-windows.zip .)
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
