name: Pony (tags)
format: tags
order: [style, character, hair, costume, pose, emotion, props, situation, location, lighting, view]
quality_prefix: "score_9, score_8_up, score_7_up"
negative_template: "score_6, score_5, score_4, lowres, bad anatomy, text, watermark"
use_negative: true
workflow_template: workflows/txt2img_checkpoint.json
defaults:
  checkpoint: ponyDiffusionV6XL.safetensors
  width: 832
  height: 1216
  steps: 28
  cfg: 6.5
  sampler: euler_ancestral
  scheduler: normal
  denoise: 1.0
injection:
  positive: "6"
  negative: "7"
  seed: "3"
  steps: "3"
  cfg: "3"
  sampler: "3"
  scheduler: "3"
  denoise: "3"
  width: "5"
  height: "5"
  checkpoint: "4"
